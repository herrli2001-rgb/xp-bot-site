<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="736" viewBox="0 0 1280 736"><rect width="1280" height="736" fill="#111112"/><g font-family="Arial, PingFang SC, sans-serif"><text x="70" y="76" fill="#f5f5f7" font-size="32" font-weight="600">五个流程，接上真实工作。</text><text x="70" y="112" fill="#86868b" font-size="16">流程概览示意 · 不含真实业务数据</text><rect x="65" y="151" width="1150" height="79" rx="16" fill="#222224" stroke="#3a3a3d"/><text x="92" y="183" font-size="19" fill="#f5f5f7">大店预警监管</text><text x="92" y="210" font-size="13" fill="#99999e">原来 · 人工 1 小时</text><text x="610" y="197" font-size="18" fill="#d2d2d7">→　按计划后台执行</text><rect x="65" y="250" width="1150" height="79" rx="16" fill="#222224" stroke="#3a3a3d"/><text x="92" y="282" font-size="19" fill="#f5f5f7">大店对应表</text><text x="92" y="309" font-size="13" fill="#99999e">原来 · 人工 50 分钟</text><text x="610" y="296" font-size="18" fill="#d2d2d7">→　自动维护与回读</text><rect x="65" y="349" width="1150" height="79" rx="16" fill="#222224" stroke="#3a3a3d"/><text x="92" y="381" font-size="19" fill="#f5f5f7">新品表，上新全流程</text><text x="92" y="408" font-size="13" fill="#99999e">原来 · 人工 30 分钟</text><text x="610" y="395" font-size="18" fill="#d2d2d7">→　按确认阶段接续执行</text><rect x="65" y="448" width="1150" height="79" rx="16" fill="#222224" stroke="#3a3a3d"/><text x="92" y="480" font-size="19" fill="#f5f5f7">大店商品素材巡检</text><text x="92" y="507" font-size="13" fill="#99999e">原来 · 人工 3 小时</text><text x="610" y="494" font-size="18" fill="#d2d2d7">→　巡检、补全与复检代办</text><rect x="65" y="547" width="1150" height="79" rx="16" fill="#222224" stroke="#3a3a3d"/><text x="92" y="579" font-size="19" fill="#f5f5f7">大店自动化新品打标</text><text x="92" y="606" font-size="13" fill="#99999e">原来 · 人工 30 分钟</text><text x="610" y="593" font-size="18" fill="#d2d2d7">→　自动出稿，审批后接续</text></g></svg>